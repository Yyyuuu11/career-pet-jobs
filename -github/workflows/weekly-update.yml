name: 每周自动更新岗位与招聘数据

# 触发：① 每周一 09:00（北京时间）自动运行  ② 手动在 Actions 页面点 Run workflow（答辩演示用）
on:
  schedule:
    # UTC 周一 01:00 == 北京时间周一 09:00（中国不实行夏令时，固定 +8）
    - cron: '0 1 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write   # 允许工作流把新生成的 JSON 推回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成最新数据（招聘/岗位/元信息）
        run: node generate-data.js

      - name: 提交并推送（仅当有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market-data.json jobs-data.json meta.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 每周自动更新数据 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
