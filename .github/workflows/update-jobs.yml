name: 更新招聘数据
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node collect.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain jobs.json)" ]; then
            git add jobs.json
            git commit -m "chore: 自动更新招聘数据 $(date +%F)"
            git push
          fi
