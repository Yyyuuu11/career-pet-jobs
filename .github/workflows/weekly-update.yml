name: 每周自动更新岗位与招聘数据

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成最新数据（招聘/岗位/元信息）
        run: node generate-data.js

      - name: 提交并推送（仅当有变化）
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add market-data.json jobs-data.json meta.json
            if git diff --cached --quiet; then
              echo "数据无变化，跳过提交"
            else
              git commit -m "chore: 每周自动更新数据 $(date +'%Y-%m-%d %H:%M')"
              git push
            fi
